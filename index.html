<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro, consulta e simulação hidráulica de reservatórios de usinas hidrelétricas." />
  <title>Simulador Hidráulico de Reservatórios</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icone-180.png" />
  <meta name="theme-color" content="#14332d" />
  <link rel="manifest" href="manifest.webmanifest" />
  <!-- Tema gravado aplicado antes do primeiro desenho, para não piscar. -->
  <script>
    try {
      var t = localStorage.getItem('tema');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="marca-simbolo" aria-hidden="true">
        <!-- Mesmo desenho do favicon (icone.svg). Ids próprios para não
             colidir com outros SVG da página. -->
        <svg width="28" height="28" viewBox="0 0 64 64">
          <defs>
            <clipPath id="marca-c"><rect width="64" height="64" rx="15" /></clipPath>
            <linearGradient id="marca-f" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c3ff24" stop-opacity=".55" />
              <stop offset="1" stop-color="#c3ff24" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g clip-path="url(#marca-c)">
            <rect width="64" height="64" fill="#14332d" />
            <path d="M0 48 C8 48 13 19 24 19 C34 19 38 36 48 40 C55 42.5 59 43 64 43 V64 H0 Z" fill="url(#marca-f)" />
            <path d="M0 48 C8 48 13 19 24 19 C34 19 38 36 48 40 C55 42.5 59 43 64 43" fill="none"
                  stroke="#c3ff24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
      </span>
      <div style="min-width:0">
        <h1>Simulador Hidráulico</h1>
      </div>
    </div>
    <nav class="abas" id="navegacao">
      <a href="#/simular" data-rota="simular">Simular</a>
      <a href="#/cheia" data-rota="cheia">Cheia</a>
      <a href="#/usinas" data-rota="usinas">Usinas</a>
      <a href="#/reservatorios" data-rota="reservatorios">Reservatórios</a>
      <a href="#/registros" data-rota="registros">Registros</a>
      <a href="#/historico" data-rota="historico">Histórico</a>
    </nav>
    <button type="button" class="botao-tema" id="btn-tema" aria-label="Alternar tema claro e escuro">
      <svg class="icone-lua" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z" />
      </svg>
      <svg class="icone-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
    </button>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <footer class="rodape">
    <p>Balanço hídrico puro (ΔV = (Q<sub>af</sub> − Q<sub>def</sub>)·Δt), sem perdas por evaporação, infiltração ou uso consuntivo.</p>
  </footer>

  <!-- Bibliotecas servidas pelo próprio app (versões fixas, licenças em
       vendor/): sem internet na sala de controle, gráficos e importação de
       planilha continuam funcionando. -->
  <script src="vendor/chart.umd.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
  <!-- Modo sem internet (sw.js). Registrado aqui, fora dos módulos: se o
       SDK do Firebase falhar ao carregar, o app.js inteiro não roda, e o
       registro não pode depender dele. -->
  <script>
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.warn('Sem modo offline:', e); });
    }
  </script>
</body>
</html>
