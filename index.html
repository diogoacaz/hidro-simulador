<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro, consulta e simulação hidráulica de reservatórios de usinas hidrelétricas." />
  <title>Simulador Hidráulico de Reservatórios</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="marca-simbolo" aria-hidden="true">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <path d="M2 10.5c1.4 0 1.4-1.4 2.8-1.4s1.4 1.4 2.8 1.4 1.4-1.4 2.8-1.4 1.4 1.4 2.8 1.4" />
          <path d="M2 13.5c1.4 0 1.4-1.4 2.8-1.4s1.4 1.4 2.8 1.4 1.4-1.4 2.8-1.4 1.4 1.4 2.8 1.4" />
          <path d="M3.5 6.2 8 2.5l4.5 3.7" stroke-linejoin="round" />
        </svg>
      </span>
      <div style="min-width:0">
        <h1>Simulador Hidráulico</h1>
        <p class="subtitulo">Balanço hídrico em passos de 15 min · limites operacionais e emergenciais</p>
      </div>
    </div>
    <nav class="abas" id="navegacao">
      <a href="#/simular" data-rota="simular">Simular</a>
      <a href="#/usinas" data-rota="usinas">Usinas</a>
      <a href="#/reservatorios" data-rota="reservatorios">Reservatórios</a>
      <a href="#/registros" data-rota="registros">Registros</a>
      <a href="#/historico" data-rota="historico">Histórico</a>
    </nav>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <footer class="rodape">
    <p>Balanço hídrico puro (ΔV = (Q<sub>af</sub> − Q<sub>def</sub>)·Δt), sem perdas por evaporação, infiltração ou uso consuntivo.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
