<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro, consulta e simulação hidráulica de reservatórios de usinas hidrelétricas." />
  <title>Simulador Hidráulico de Reservatórios</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icone-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="marca-simbolo" aria-hidden="true">
        <!-- Mesma forma do favicon (icone.svg): a onda de cheia sobre duas
             linhas d'água. O quadrado lima vem do CSS. -->
        <svg width="28" height="28" viewBox="0 0 64 64" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.5 32.5 C15 32.5 17.5 14 24.5 14 C31 14 33 23.5 39 26 C44 28 49 27 53.5 25" stroke-width="5.4" />
          <path d="M10.5 41.5 Q16 37 21.5 41.5 T32.5 41.5 T43.5 41.5 T53.5 41.5" stroke-width="4.2" />
          <path d="M10.5 50.5 Q16 46 21.5 50.5 T32.5 50.5 T43.5 50.5 T53.5 50.5" stroke-width="3.8" />
        </svg>
      </span>
      <div style="min-width:0">
        <h1>Simulador Hidráulico</h1>
      </div>
    </div>
    <nav class="abas" id="navegacao">
      <a href="#/simular" data-rota="simular">Simular</a>
      <a href="#/cheia" data-rota="cheia">Cheia</a>
      <a href="#/usinas" data-rota="usinas">Usinas</a>
      <a href="#/reservatorios" data-rota="reservatorios">Reservatórios</a>
      <a href="#/registros" data-rota="registros">Registros</a>
      <a href="#/historico" data-rota="historico">Histórico</a>
    </nav>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <footer class="rodape">
    <p>Balanço hídrico puro (ΔV = (Q<sub>af</sub> − Q<sub>def</sub>)·Δt), sem perdas por evaporação, infiltração ou uso consuntivo.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
