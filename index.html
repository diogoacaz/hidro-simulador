<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cadastro, consulta e simulação hidráulica de reservatórios de usinas hidrelétricas." />
  <title>Simulador Hidráulico de Reservatórios</title>
  <link rel="icon" href="icone.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icone-180.png" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topo">
    <div class="topo-marca">
      <span class="marca-simbolo" aria-hidden="true">
        <!-- Mesmo desenho do favicon (icone.svg). Ids próprios para não
             colidir com outros SVG da página. -->
        <svg width="28" height="28" viewBox="0 0 64 64">
          <defs>
            <clipPath id="marca-c"><rect width="64" height="64" rx="15" /></clipPath>
            <linearGradient id="marca-f" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#c3ff24" stop-opacity=".55" />
              <stop offset="1" stop-color="#c3ff24" stop-opacity="0" />
            </linearGradient>
          </defs>
          <g clip-path="url(#marca-c)">
            <rect width="64" height="64" fill="#14332d" />
            <path d="M0 48 C8 48 13 19 24 19 C34 19 38 36 48 40 C55 42.5 59 43 64 43 V64 H0 Z" fill="url(#marca-f)" />
            <path d="M0 48 C8 48 13 19 24 19 C34 19 38 36 48 40 C55 42.5 59 43 64 43" fill="none"
                  stroke="#c3ff24" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round" />
          </g>
        </svg>
      </span>
      <div style="min-width:0">
        <h1>Simulador Hidráulico</h1>
      </div>
    </div>
    <nav class="abas" id="navegacao">
      <a href="#/simular" data-rota="simular">Simular</a>
      <a href="#/cheia" data-rota="cheia">Cheia</a>
      <a href="#/usinas" data-rota="usinas">Usinas</a>
      <a href="#/reservatorios" data-rota="reservatorios">Reservatórios</a>
      <a href="#/registros" data-rota="registros">Registros</a>
      <a href="#/historico" data-rota="historico">Histórico</a>
    </nav>
  </header>

  <main id="conteudo" class="conteudo"></main>

  <footer class="rodape">
    <p>Balanço hídrico puro (ΔV = (Q<sub>af</sub> − Q<sub>def</sub>)·Δt), sem perdas por evaporação, infiltração ou uso consuntivo.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
