<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Simulador Hidráulico — onda de cheia">
  <defs>
    <clipPath id="c"><rect width="64" height="64" rx="15"/></clipPath>
    <linearGradient id="f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c3ff24" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c3ff24" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
